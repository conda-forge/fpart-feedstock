{% set name = "fpart" %}
{% set version = "1.7.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/martymac/fpart/archive/refs/tags/{{ name }}-{{ version }}.tar.gz
  sha256: 512a82320cf5418ed70416b96cd49aa51a5ae418e96482144683cad6609add2e

build:
  skip: true  # [win]
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - make
    - autoconf
    - automake
  run:
    - gawk
    - findutils
    - coreutils
    - sed
    - rsync

test:
  commands:
    - fpart -h

about:
  home: https://www.fpart.org/
  license: BSD-2-Clause
  license_family: BSD
  license_file: COPYING
  summary: Sort files and pack them into partitions

extra:
  recipe-maintainers:
    - izahn
